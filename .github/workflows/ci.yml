name: CI

# Required env vars and secrets: none. CI is hermetic (no cloud, no live LLM).
# Optional repository secret ANTHROPIC_API_KEY is only used by the manual
# "live eval" workflow, never by this one. See docs/deploy.md ("CI").

on:
  push:
    branches: [main, master, "integration/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hermetic providers: no live geocoding, LLM, or chromium in CI checks.
  LOCATION_PROVIDER: static
  OLLAMA_MOCK: "1"
  REPORT_RENDERER: stub
  # Swiss Ephemeris data files live here (fetched by scripts/fetch_ephe.py).
  ANKANA_SE_EPHE_PATH: ${{ github.workspace }}/services/api-py/ephe

jobs:
  ts:
    name: TypeScript (typecheck + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # packageManager in package.json pins the pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The Node API shells out to the Python engine via services/api-py/.venv.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api-py/pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python venv for the reading bridge
        run: |
          uv venv services/api-py/.venv --python 3.13
          uv pip install --python services/api-py/.venv/bin/python -e "services/api-py[swiss]"
          services/api-py/.venv/bin/python services/api-py/scripts/fetch_ephe.py

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @astro/api exec prisma generate

      - name: Typecheck
        run: pnpm -r lint

      - name: Unit and integration tests
        run: pnpm -r test

  python:
    name: Python (ruff + pytest, Postgres 16, Swiss Ephemeris)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/api-py
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ankana
          POSTGRES_PASSWORD: ankana_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ankana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # tests/pg/conftest.py creates a throwaway database in this server and
      # the ankana_app role, so no testcontainers/Docker is needed.
      API_TEST_ADMIN_URL: postgresql+psycopg://ankana:ankana_ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api-py/pyproject.toml

      - name: Install (dev + swiss + observability)
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev,swiss,observability]"

      - name: Cache Swiss Ephemeris data
        uses: actions/cache@v4
        with:
          path: services/api-py/ephe
          key: swisseph-data-v1-${{ hashFiles('services/api-py/scripts/fetch_ephe.py') }}

      - name: Fetch Swiss Ephemeris data
        run: |
          [ -f ephe/sepl_18.se1 ] || .venv/bin/python scripts/fetch_ephe.py

      - name: Swiss Ephemeris must be importable (swiss tests must not skip)
        run: .venv/bin/python -c "import swisseph; print(swisseph.version)"

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Migrations apply as owner (ankana) and app role works
        run: |
          .venv/bin/python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg://ankana:ankana_ci@localhost:5432/postgres", isolation_level="AUTOCOMMIT")
          with e.connect() as c:
              c.execute(text("CREATE DATABASE migcheck"))
          PY
          API_MIGRATION_URL=postgresql+psycopg://ankana:ankana_ci@localhost:5432/migcheck \
            .venv/bin/alembic upgrade head

      - name: Pytest (includes tests/pg against the service container)
        run: .venv/bin/pytest -q -rs --ignore=tests/test_lal_kitab_parity.py

      - name: No Swiss or Postgres tests were skipped
        run: |
          .venv/bin/pytest -q -rs tests/test_providers.py tests/pg 2>&1 | tee /tmp/skips.txt
          if grep -Ei "SKIPPED.*(swisseph|Postgres)" /tmp/skips.txt; then
            echo "Swiss/pg tests were skipped; CI environment is broken"; exit 1
          fi

  lal-kitab-parity:
    name: Lal Kitab parity (TS golden vs Python port)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api-py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api-py/pyproject.toml
      - run: |
          uv venv --python 3.13
          uv pip install -e ".[dev,swiss]"
      - name: Fetch Swiss Ephemeris data
        run: .venv/bin/python scripts/fetch_ephe.py
      - name: Parity suite
        run: .venv/bin/pytest -q tests/test_lal_kitab_parity.py tests/test_lalkitab_adapter.py

  eval:
    name: AI faithfulness eval (MockProvider)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api-py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api-py/pyproject.toml
      - run: |
          uv venv --python 3.13
          uv pip install -e ".[dev,swiss]"
      - name: Fetch Swiss Ephemeris data
        run: .venv/bin/python scripts/fetch_ephe.py
      # Deterministic MockProvider; exits non-zero on any shipped error or
      # refusal recall below 1.0. No network, no API key.
      - name: Run eval
        run: .venv/bin/python -m ankana_ai.eval --json eval-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-summary
          path: services/api-py/eval-summary.json
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright, live FastAPI + Postgres)
    runs-on: ubuntu-latest
    needs: [ts]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ankana
          POSTGRES_PASSWORD: ankana_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ankana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # The API runs for real: tenant /v1 on Postgres with RLS, dev-stub auth (AUTH_DEV_STUB),
      # the deterministic MockProvider instead of a live LLM, the stub PDF renderer and the
      # offline location list. No cloud, no secrets.
      API_DATABASE_URL: postgresql+psycopg://ankana_app:app_ci_pw@localhost:5432/e2e
      API_MIGRATION_URL: postgresql+psycopg://ankana:ankana_ci@localhost:5432/e2e
      AUTH_DEV_STUB: "1"
      ANKANA_AI_PROVIDER: mock
      STORAGE_LOCAL_DIR: ${{ github.workspace }}/.e2e-storage
      STORAGE_PUBLIC_BASE_URL: http://127.0.0.1:3001
      E2E_API_URL: http://127.0.0.1:3001
      E2E_WEB_PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api-py/pyproject.toml

      - name: API install (swiss ephemeris)
        working-directory: services/api-py
        run: |
          uv venv --python 3.13
          uv pip install -e ".[swiss]"
      - name: Cache Swiss Ephemeris data
        uses: actions/cache@v4
        with:
          path: services/api-py/ephe
          key: swisseph-data-v1-${{ hashFiles('services/api-py/scripts/fetch_ephe.py') }}
      - name: Fetch Swiss Ephemeris data
        working-directory: services/api-py
        run: "[ -f ephe/sepl_18.se1 ] || .venv/bin/python scripts/fetch_ephe.py"

      - name: Create database, app role and migrate
        working-directory: services/api-py
        run: |
          .venv/bin/python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg://ankana:ankana_ci@localhost:5432/postgres", isolation_level="AUTOCOMMIT")
          with e.connect() as c:
              c.execute(text("CREATE DATABASE e2e"))
              c.execute(text("CREATE ROLE ankana_app LOGIN PASSWORD 'app_ci_pw'"))
          PY
          .venv/bin/alembic upgrade head

      - name: Start API and report worker
        working-directory: services/api-py
        env:
          ANKANA_SE_EPHE_PATH: ${{ github.workspace }}/services/api-py/ephe
        run: |
          export LOCATION_PROVIDER=static REPORT_RENDERER=stub
          nohup .venv/bin/uvicorn app.main:create_app --factory --app-dir src --host 127.0.0.1 --port 3001 > ../../api.log 2>&1 &
          nohup .venv/bin/python -m app.worker > ../../worker.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3001/v1/meta && break; sleep 1; done
          curl -fsS http://127.0.0.1:3001/v1/meta

      - run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      # tests/e2e/start-web.mjs mints the dev token, then starts the Next dev server in live mode.
      - name: End-to-end tests (client, consent, chart, ask, report)
        run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            test-results/
            api.log
            worker.log
          retention-days: 7
